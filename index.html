<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Blog</title>
<meta name="description" content="Personal notes and writing.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Source+Sans+3:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="site-header">
    <div class="wrap">
      <a class="brand" href="#/">
        <span class="brand-mark">§</span>
        <span class="brand-name">My Blog</span>
      </a>
      <p class="tagline">notes, half-finished thoughts, and things I learned</p>
    </div>
  </header>

  <main class="wrap" id="app">
    <!-- content is rendered here by app.js -->
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <span>© <span id="year"></span> My Blog</span>
      <span class="dot">·</span>
      <a href="#/">All posts</a>
    </div>
  </footer>

  <script src="posts.js"></script>
  <script src="app.js"></script>
</body>
</html>
